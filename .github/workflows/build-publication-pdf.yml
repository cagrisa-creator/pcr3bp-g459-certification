name: Build publication PDF

on:
  push:
    branches:
      - publication-editorial-revision-20260927
    paths:
      - manuscript/G459_ALL_SUBCRITICAL_PUBLICATION_CANDIDATE_20260927.tex
      - .github/workflows/build-publication-pdf.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript/G459_ALL_SUBCRITICAL_PUBLICATION_CANDIDATE_20260927.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Collect QA files
        if: always()
        run: |
          mkdir -p publication_build
          PDF_PATH="$(find . -name 'G459_ALL_SUBCRITICAL_PUBLICATION_CANDIDATE_20260927.pdf' -type f | head -n 1)"
          LOG_PATH="$(find . -name 'G459_ALL_SUBCRITICAL_PUBLICATION_CANDIDATE_20260927.log' -type f | head -n 1)"
          if [ -n "$PDF_PATH" ]; then cp "$PDF_PATH" publication_build/; fi
          if [ -n "$LOG_PATH" ]; then
            cp "$LOG_PATH" publication_build/
            grep -E "Warning|Overfull|Underfull|undefined|multiply defined" "$LOG_PATH" > publication_build/LATEX_WARNINGS.txt || true
          fi
          find . -maxdepth 3 -name 'G459_ALL_SUBCRITICAL_PUBLICATION_CANDIDATE_20260927.*' -type f -print > publication_build/FOUND_BUILD_FILES.txt || true

      - name: Upload PDF and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-pdf-qa
          path: publication_build/
          if-no-files-found: warn
